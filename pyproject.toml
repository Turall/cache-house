[project]
name = "cache-house"
version = "1.1.0"
description = "Caching tool for python"
readme = "README.md"
license = "MIT"
license-files = ["LICENCE.md"]
authors = [{ name = "Tural Muradov", email = "tural_m@hotmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "redis>=8.2.0,<9.0.0",
]

[project.urls]
Homepage = "https://github.com/Turall/cache-house"
Repository = "https://github.com/Turall/cache-house"

[dependency-groups]
dev = [
    "pytest>=9.0.1,<10.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "black>=25.11.0,<26.0.0",
    "fakeredis>=2.32.1,<3.0.0",
]

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
